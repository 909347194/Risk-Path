# ============================================================================
# 公共配置 (Common Configuration)
# ============================================================================
# 所有实验场景共享的参数，包括风险模型、噪声敏感度、POI权重等
# 微观实验和宏观案例研究都会引用此文件

# --------------------------------------------------------------------------
# 1. 动态坠机概率 P_crash 参数 (Cox PH Model)
# P_crash = 1 - exp(-lambda_base * Phi * dt)
# --------------------------------------------------------------------------
crash_probability:
    lambda_base: 0.00001 # 基础坠机率 (1e-5)

    # 风场影响参数
    wind:
        V_limit: 12.0 # 抗风极限 (m/s)，蒲福6级
        k_w: 3.0 # 风敏感系数
        theta: 2.0 # 风非线性指数

    # 降雨影响参数
    rain:
        gamma_rain: 0.005 # 雨敏感系数

    # 城市峡谷/障碍物影响参数
    urban_canyon:
        K_obs: 10.0 # 最大风险放大倍数
        epsilon: 0.000001 # 防除零常数
        w_svf: 0.4 # 天空可视因子权重
        w_height_ratio: 0.4 # 建筑高度比权重
        w_proximity: 0.2 # 建筑邻近度权重
        alpha_svf: 1.5 # SVF指数参数

# --------------------------------------------------------------------------
# 2. 人口潮汐与POI吸引力参数
# --------------------------------------------------------------------------
population_tidal:
    # POI空间衰减参数 (按场景模式区分)
    sigma_decay:
        micro: 60.0 # 微观400m环境，较小半径产生剧烈风险梯度
        macro: 300.0 # 宏观10km环境，符合城市功能区覆盖范围

    # POI类别权重 (与poi_parser.py的5类一致)
    poi_weights:
        residential: 1.0
        office: 1.2
        institution: 0.8
        transport: 2.0
        industrial: 0.5

    # 时间激活函数参数 (混合高斯模型)
    activation:
        office_peaks: [8.5, 18.0] # 办公区高峰时刻
        office_std: [1.0, 1.5] # 办公区高峰标准差
        school_peaks: [8.0, 16.0] # 学校高峰时刻
        school_std: [0.5, 0.5] # 学校高峰标准差

# --------------------------------------------------------------------------
# 3. 噪声社会敏感度系数 (S-T矩阵)
# 参考论文 Table 6: 空间-时间敏感度矩阵
# --------------------------------------------------------------------------
noise_sensitivity:
    # 土地利用敏感度系数 (对应论文 S 列)
    # 注：实际映射由 dynamic_noise.py 的 NoiseConfig 处理
    # 此处记录论文定义的完整 S-T 矩阵供参考
    landuse_coefficients:
        natural_open: 0.0 # 自然与开放空间
        industrial_logistics: 0.2 # 工业与物流区
        infrastructure_transport: 0.5 # 基础设施与交通走廊
        commercial_administrative: 0.5 # 商业与行政区
        residential: 1.0 # 住宅区
        quiet_service: 2.0 # 高敏感保护区域 (学校/医院)

    # 时间惩罚系数 (对应论文 T_day, T_night 列)
    # 注：逐类别惩罚由 NoiseConfig.time_penalty 定义
    # 此处保留全局默认值作为后备
    time_penalty:
        daytime: 1.5 # 住宅区昼间惩罚
        nighttime: 10.0 # 住宅区夜间惩罚

# --------------------------------------------------------------------------
# 4. 财产与伤亡模型参数
# --------------------------------------------------------------------------
property_risk:
    log_normal_mu: 3.04 # 建筑高度分布均值 (基于新加坡/日本数据拟合)
    log_normal_sigma: 0.5 # 建筑高度分布标准差
    max_prop_damage: 1000.0 # 撞击建筑最大损失

fatal_risk:
    lethal_alpha: 1000000.0 # 致死能量参数 alpha
    lethal_beta: 100.0 # 能量阈值 beta

# --------------------------------------------------------------------------
# 5. 无人机飞行约束 (物理限制)
# --------------------------------------------------------------------------
uav_constraints:
    cruise_speed: 10.0 # 巡航速度 (m/s)
    max_climb_rate: 5.0 # 最大爬升率 (m/s)
    max_descent_rate: 5.0 # 最大下降率 (m/s)
    turn_radius: 15.0 # 转弯半径 (m)
    safety_margin: 5.0 # 安全裕度 (m)
    max_altitude: 120.0 # 最大飞行高度 (m)
    min_altitude: 10.0 # 最小飞行高度 (m)

# --------------------------------------------------------------------------
# 6. 成本权重预设场景
# --------------------------------------------------------------------------
cost_weight_presets:
    # 默认均衡模式
    default:
        w_ops: 0.4 # 运营效率 (距离/时间)
        w_fatal: 0.3 # 致命伤亡风险
        w_prop: 0.15 # 财产损失风险
        w_noise: 0.15 # 噪音滋扰

    # 医疗急救模式：效率第一
    emergency:
        w_ops: 0.8
        w_fatal: 0.1
        w_prop: 0.05
        w_noise: 0.05

    # 深夜静音模式：噪音惩罚极大
    quiet_night:
        w_ops: 0.2
        w_fatal: 0.2
        w_prop: 0.1
        w_noise: 0.5

    # 绝对安全优先：监管机构视角
    strict_safety:
        w_ops: 0.0
        w_fatal: 0.7
        w_prop: 0.2
        w_noise: 0.1

# --------------------------------------------------------------------------
# 7. 情景化低空风环境 (Scenario-based low-altitude wind environment)
# --------------------------------------------------------------------------
# 定位：不是 CFD，也不重建真实城市微尺度风场。借鉴 Dong et al. (2026) 的
#       时空异质性思想，用典型风速情景 + 时间变化 + 高度修正 + 城市形态修正
#       生成用于 UAV 动态风险评价的 V(x,y,z,t)。
# 模型：V = V_ref(t) · F_z(z) · F_urban(x,y) · F_gust(t)
# 约束：① F_urban 与城市峡谷风险 f_obs 绝不重复计权（遮蔽衰减 vs 放大，独立机制）
#       ② 风场只作在线查询的状态属性，绝不膨胀成显式 4D 搜索空间
# 详见：src/tensor_engine/wind_environment.py
wind_environment:

    mode: scenario                       # 默认情景模式（非 ERA5）

    scenarios:                           # 典型风速情景（实验参数，非实测值，单位 m/s）
        weak:
            reference_speed: 3.0
        moderate:
            reference_speed: 6.0
        strong:
            reference_speed: 9.0

    default_scenario: moderate

    temporal_variation:                 # V_ref(t) = V0·[1 + A_t·sin(2π t/T + φ)]
        enabled: true
        amplitude: 0.15
        period_hours: 24.0
        phase: 0.0

    vertical_profile:                   # F_z(z)：z_min→min_factor，z_max→max_factor（平滑插值）
        enabled: true                   # 注：采用端点插值 min+(max-min)·norm，
        min_factor: 0.85                #      非规格文字中的 “1 + A_z·norm”（后者在 z_min 处恒为 1，
        max_factor: 1.20                #      与给定端点 0.85/1.20 矛盾，按端点优先实现）

    urban_modifier:                     # F_urban = clip(1 - β·C_shelter, min, max)
        enabled: true                   # C_shelter = clip(1 - SVF, 0, 1)（遮蔽衰减，≤1）
        beta: 0.20                       # 与 f_obs(R_canyon) 机制独立、符号相反，杜绝重复计权
        min_factor: 0.80
        max_factor: 1.05

    gust:                               # AR(1) 阵风，默认关闭（保证确定性实验）
        enabled: false
        rho: 0.85
        sigma: 0.10
        min_factor: 0.80
        max_factor: 1.25
        seed: 42
