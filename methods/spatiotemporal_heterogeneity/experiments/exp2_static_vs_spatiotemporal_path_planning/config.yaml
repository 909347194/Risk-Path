# ============================================================================
# Exp 2 — Static Risk vs Spatiotemporal Risk（核心实验）
# ============================================================================
# 核心问题：为什么不用时间平均的静态风险图？显式建模时空异质性到底带来什么？
#
# 三组公平对照（同一 OD、同一 A*、同一权重，仅「风险项的时间口径」不同）：
#   M1 distance_only  : J = L                      （Distance-only A*，基础 baseline）
#   M2 static_risk    : J = L + λ·C̄(x,y,z)        （Static Risk A*）
#                      C̄(x,y,z) = (1/T)Σ_t C(x,y,z,t)（时间平均风险）
#   M3 spatiotemporal : J = L + λ·C(x,y,z,t)      （Spatiotemporal Risk A*，本文方法）
#
# 三种方法的路径统一在「真实时空风险场」上后评估（公平比较），
# 分别在 08:00 / 12:00 / 18:00 / 22:00 出发。
#
# 判读原则（README §4）：主结果是 R_ST < R_static（安全收益），
# 长度是代价项（L_ST ≈ L_static 或略长）——「更短」不是卖点。
#
# 为什么必须有 M1：否则 reviewer 会问「Static 和 ST 都绕风险区，是不是风险
# 建模在起作用？」——Distance-only 补全 baseline chain（README §1）。

experiment:
  name: exp2_static_vs_spatiotemporal_path_planning
  description: >-
    Static Risk vs Spatiotemporal Risk：在真实数据四维风险张量上对比
    距离最优（M1）、静态时间平均风险规避（M2）、时空风险规避（M3）三种规划目标，
    证明「时间平均风险图」会在特定出发时刻付出显著的安全代价，
    而时空感知规划随出发时刻自适应调整路径。
  owner: ""
  created: "2026-09-29"
  updated: "2026-10-09"
  seed: 42

# --------------------------------------------------------------------------
# 数据源：真实数据（data/02_processed 只读加载，与 Exp1 完全同源）
# --------------------------------------------------------------------------
data:
  type: real

# --------------------------------------------------------------------------
# 网格：宏观案例尺度（真实数据 100×100；96 时相 × 15 min）
# --------------------------------------------------------------------------
spatial_grid:
  nx: 100
  ny: 100
  nz: 12
  resolution_xy: 48.459
  resolution_z: 10.0

time:
  total_slices: 96
  slice_minutes: 15

# 继承公共配置（风险模型 / POI 权重 / wind_environment 等）
extends: ../../configs/common.yaml

# --------------------------------------------------------------------------
# 实验参数
# --------------------------------------------------------------------------
params:
  grid: macro

  # 固定同一个 OD（控制变量：3 方法 × 4 时刻全部共用，共 12 次搜索）。
  # 与 Exp1 当前配置一致的双核走廊：(8,61) → (95,5)。
  # 注：旧起点 (5,70) 处建筑高 57.6 m，在 60 m 层（障碍下界 50 m）被判为障碍
  #（建筑硬约束张量接入后 planner 报 start_in_obstacle），与 Exp1 同步南移
  # 9 格到 (8,61)（建筑 18.9 m，60 m 层畅通）。
  # 格式 [sx, sy, sz, gx, gy, gz]，sz/gz = 5 为 60 m 起降层。
  od: [8, 61, 5, 95, 5, 5]

  # 四个出发时刻（小时）
  departure_hours: [8, 12, 18, 22]

  # 巡航高度：z_layer=5 → 层中心 60 m
  z_layer: 5
  flight_altitude: 60.0

  # 60 m 定高巡航：锁定 z=5 层。
  # 本实验聚焦「时间」维度对比，定高锁排除高度自由度对三种方法的不对称影响；
  # 另一实测约束：解锁定高单次搜索 ~2.5 min（Exp1 冒烟），定高单次 ~7 s，
  # 12 次搜索 + 后评估全程可控。
  cruise_altitude_lock: true

  wind_scenario: moderate
  uav_speed: 10.0
  survival_threshold: 0.0

  # 搜索迭代上限（安全阀）：触顶显式报 max_iterations_exceeded（≠ 无解）
  max_iterations: 3000000

  # ------------------------------------------------------------------
  # 权重（与 Exp1 主设定一致；2026-10-13 重标定）。
  # P_crash 暴露口径修正（整时相 900s → 格穿越 6.8s，k ≈ 132）后，
  # p 系代价项（δC_f/δC_p）缩小 k 倍，为保持已标定的「风险参与选路」
  # regime，w_fatal/w_prop 同比放大 k=132；w_noise 不动（δC_n = n·dt
  # 本就按实际飞行时间计，未受暴露 bug 影响）；w_ops 不动。
  # 目标函数的归一化实现（astar_4d._expand_node，论文 §3.4 Eq.10）：
  #   δJ = w_f·δC_f/Ω_f + w_p·δC_p/Ω_p + w_n·δC_n/Ω_n + w_d·(d/d_max)
  # 与论文 J = L + λ·C 的对应：λ ≡ w_risk/w_ops（Ω 归一后比值 132000）；
  # J 乘任意正常数不改变 argmin，故 M2/M3 共用本组权重，仅风险时间口径不同。
  # M1 的 J = L 即 w_d=1、风险权重全 0（make_planner_cfg 内按方法切换）。
  # ------------------------------------------------------------------
  w_ops: 0.03
  w_fatal: 3960.0
  w_prop: 1584.0
  w_noise: 7.5

  # 降雨情景（Exp2 可选机制，默认关闭）：项目自带 ScenarioRainEnvironment，
  # I(x,y,t)=I_ref·S(x,y)·T(t)——本身是「空间局部(hotspot)+时段性(active_hours)」
  # 的强度场，物理上对应一片局地强降雨单体扫过航路。
  # ⚠️ 实测结论（见 README §6 诊断）：realistic 强度下 f_rain≤1.3×，热点 p_crash
  # 仅 0.03→0.036，无法驱动走廊切换；即使 heavy(25 mm/h，已超运行上限 R_limit=10)
  # 也只到 ~0.10，规划器仍直穿（path-change rate=0.00）。根因：基础风险场已高且
  # 空间异质，雨的物理增益（γ=0.005、I²、运行上限封顶）结构上到不了"近不可通行"
  # （p_crash→~0.95），故内置雨模型不是合格的局部时间热点演示机制。
  # 启用本情景请把下方 localized_hazard.enabled 改 false。
  rain:
    enabled: false
    scenario: heavy          # light/moderate/heavy；moderate≤10 真实可飞但效应弱
    spatial_mode: hotspot    # uniform | hotspot（hotspot 提供空间局部性）
    center: [34, 13]         # 钉在 Static 真实航路中段（(19,16)→(49,11) 对角段）
    radius: 16               # 热点半径（cells）
    active_hours: [8, 13]    # 活跃时段：覆盖 08:00 / 12:00 两面板，18:00 / 22:00 关闭

  # ------------------------------------------------------------------
  # 极端局地危险事件情景（Exp2 可选演示机制，默认关闭；真实数据口径见下）：
  # 以「强对流单体 / 临时限飞区」形式呈现——物理上即一片局地极端天气/危险单体
  # 在部分时段扫过航路，与上方 rain 概念同源；但项目内置降雨模型在 realistic 强度下
  # 达不到可演示量级（见 rain 节实测），故用直接乘性脉冲参数化到可演示强度
  # （峰值×12, clip 0.95）。⚠️ 重要：合并远程新口径(6.8s 暴露)后，基础 p_crash 被
  # 稀释约 132 倍，该情景在新口径下失效（ST 在活跃时段仍与 Static 同走廊，见 README
  # §6），故默认关闭、回归真实数据干净口径；如需演示脉冲效应，改 enabled: true。
  localized_hazard:
    enabled: false
    center: [10, 24]        # 网格中心（钉在 Static 真实航路内移段，制造两条可选走廊）
    radius: 16              # 高斯尺度（cells）
    window: [8, 13]         # 活跃时段（小时）：覆盖 08:00 / 12:00 两面板，18:00 / 22:00 关闭
    peak_multiplier: 12.0   # 热点区内 p_crash 峰值放大倍数（clip 0.95）
    clip: 0.95
