# ============================================================================
# 实验配置模板（复制 _template/ 后改这份）
# ============================================================================
# 必备：spatial_grid + time（create_grid_from_config 依赖）
# 其余节自由定义，入口脚本自行读取

experiment:
  name: _template                # 同目录名，运行时会打印便于核对
  description: "在这里写实验目的（一两句话）"
  owner: ""
  created: ""
  seed: 42                       # 随机种子：保证可复现

# --------------------------------------------------------------------------
# 网格（方式A：直接给 nx/ny/nz）
# --------------------------------------------------------------------------
spatial_grid:
  nx: 100
  ny: 100
  nz: 12
  resolution_xy: 48.459          # m/格（研究区实测格宽，见 utils/coord_transform.py）
  resolution_z: 10.0             # m/层

# 或方式B：由范围和分辨率自动推算（二选一，留 nx/ny/nz 则本段其余项可删）
# spatial_grid:
#   x_min: 0
#   x_max: 4845.9
#   y_min: 0
#   y_max: 4793.6
#   z_min: 0
#   z_max: 120
#   resolution_xy: 48.459
#   resolution_z: 10.0

# --------------------------------------------------------------------------
# 时间
# --------------------------------------------------------------------------
time:
  total_slices: 96               # 时相数（24h × 15min）
  slice_minutes: 15

# --------------------------------------------------------------------------
# 继承公共配置（可选）：实验值覆盖公共值
# --------------------------------------------------------------------------
extends: ../../configs/common.yaml

# --------------------------------------------------------------------------
# 实验参数（自定义）
# --------------------------------------------------------------------------
params:
  # n_mc: 1000
  # lambda_scale: 1.0

# 数据路径（相对本实验目录，用 ../.. 回到 spatiotemporal_heterogeneity）
data:
  # processed_dir: ../../data/02_processed
  # raw_dir: ../../data/01_raw
