# ============================================================================
# Exp 1 补跑配置 —— 峰谷出发时刻（最大化时间对比度）
# ============================================================================
# 目的：README §3 指出 8/12/18/22 四个出发时刻"完美避开"了走廊风险的峰
# （5.75h）与谷（17.75h）（heterogeneity.csv: peak/trough = 5.75/17.75,
# 峰谷比 1.34），导致 ΔP_crash(12h−22h) 均值仅 1.4e-5，路径分化证据弱。
# 本配置补跑风险峰/谷时刻，把时间对比度拉满：
#   5.75h (05:45, 风险峰) / 12h (正午) / 17.75h (17:45, 风险谷) / 22h (夜间)
# 其余（数据源、OD、权重、解锁定高）全部继承 config.yaml，保证口径可比。
#
# 运行：python3 run.py config_rerun.yaml
# 产物：results_rerun/（独立目录，不覆盖 results/ 的基准产物）
# ============================================================================
extends: config.yaml

experiment:
    name: exp1_peak_trough_rerun
    description: >-
        峰谷出发时刻补跑：在 config.yaml 基础上把出发时刻换成风险峰(05:45)、
        正午(12:00)、风险谷(17:45)、夜间(22:00)，最大化时间维度对比度，
        检验「风险场时刻差异 → 最优路径分化」的传导强度。

params:
    # 出发时刻（小时，小数支持 15 min 分辨率；5.75→slice 23, 17.75→slice 71）
    departure_hours: [5.75, 12, 17.75, 22]

    # 产物写到独立目录，保留 results/ 基准结果以便对比
    out_dir: results_rerun

    # 敏感性扫描只跑峰谷对（极差口径依然是跨时刻极差，省一半算力）
    sensitivity:
        enabled: true
        w_fatal_values: [3168.0, 3960.0, 4752.0, 5544.0]
        hours: [5.75, 17.75]
