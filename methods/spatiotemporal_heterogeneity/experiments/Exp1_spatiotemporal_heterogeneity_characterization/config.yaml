# ============================================================================
# Exp 1 — 时空异质性表征 (Spatiotemporal Heterogeneity Characterization)
# ============================================================================
# 核心问题：风险场是否明显随「空间」和「时间」同时变化？
# 可视化证据：同一城市、同一 OD、4 个出发时刻
#            → risk landscape 不同 → optimal path 不同。
#
# 数据源：真实数据（data/01_raw + data/02_processed 顶层），不使用合成数据。
# 网格：宏观案例尺度 100×100×12（与真实数据对齐，dx=48.459m, dy=47.936m）。
# 配置跟着实验走：本文件只放实验专属参数；风险模型/POI/风等公共参数
# 通过 extends 继承 configs/common.yaml。

experiment:
    name: exp1_spatiotemporal_heterogeneity_characterization
    description: >-
        时空异质性表征（机制实验，真实数据）。基于真实城市数据（建筑高度、用地、
        POI、人口潮汐）与情景化低空风场构建四维风险张量 Cost(x,y,z,t)，在多个
        出发时刻可视化风险场，并对同一 OD 运行 TD-RiskA*（高度自由，起降层
        60 m），检验「出发时刻 → 风险场 → 最优路径」的传导关系并量化其强弱。
    owner: ""
    created: "2026-09-27"

# --------------------------------------------------------------------------
# 数据源：真实数据
# --------------------------------------------------------------------------
data:
    type: real # real | synthetic（本实验固定用真实数据）

# --------------------------------------------------------------------------
# 网格：宏观案例尺度（真实数据 100×100；96 时相 × 15 min）
# 注：run.py 用 get_macro_grid() 取精确分辨率 dx=48.459m / dy=47.936m；
#     此处 spatial_grid 记录同一维度，便于阅读与后续扩展。
# --------------------------------------------------------------------------
spatial_grid:
    nx: 100
    ny: 100
    nz: 12
    resolution_xy: 48.459
    resolution_z: 10.0

time:
    total_slices: 96
    slice_minutes: 15

# 继承公共配置（风险模型 / POI 权重 / wind_environment 等）
extends: ../../configs/common.yaml

# --------------------------------------------------------------------------
# 实验参数（自定义）
# --------------------------------------------------------------------------
params:
    # 网格尺度：macro（真实数据）| micro（合成数据）
    grid: macro

    # 同一 OD（起点 → 终点）：双核风险走廊。
    # 选线依据（Exp1 重构）：人口双核 A(22,52) 与 B(72,18) 全天交替活跃
    # （51/39 时相），走廊 (5,70)→(95,5) 距核 A 仅 4.6 格、距核 B 2.9 格，
    # 双核都贴着直线路径 → 出发时刻改变时才存在绕行必要性。
    # （旧 OD (3,93)→(85,10) 距核 A 15.3 格，绕行无收益，实测四路重合 1.24%。）
    # 格式 [sx, sy, sz, gx, gy, gz]，sz/gz = 5 为 60 m 起降层。
    # 注意：原起点 (5,70) 处建筑高 57.6 m，在 60 m 层（层下界 50 m）被判为障碍
    # → planner 报 start_in_obstacle。起点南移 9 格到 (8,61)（该处建筑 ≤50 m，
    # 60 m 层畅通），走廊仍几乎穿过核 A（直线距核 A ≈0.01 格），保持实验意图。
    od: [8, 61, 5, 95, 5, 5]

    # 四个出发时刻（小时）
    departure_hours: [8, 12, 18, 22]

    # 巡航高度：z_layer=5 → 层中心 60 m
    z_layer: 5
    flight_altitude: 60.0

    # 定高巡航：解除锁定，允许全程 12 层自由寻优。
    # 理由（Exp1 重构）：定高锁死只给了水平绕行一个自由度；三维绕行
    # （从风险核上方/下方穿越）是配送机真实的规避手段，也给路径响应以舞台。
    cruise_altitude_lock: false

    # 风情景（继承 common.yaml 的 wind_environment；可在此覆盖 default_scenario）
    wind_scenario: moderate

    uav_speed: 10.0
    survival_threshold: 0.0 # 表征实验只报告存活率，不硬性截断

    # ------------------------------------------------------------------
    # TD-RiskA* 成本权重（风险规避标定，见 README「权重标定说明」）
    # 【2026-10-13 重标定】P_crash 暴露口径修正（整时相 900s → 格穿越
    # 6.8s，k ≈ 132）后，p 系代价项（δC_f/δC_p）单步量级同步缩小 k 倍。
    # 为保持已标定的「风险参与选路」regime（加权风险增量 ≈ 加权距离增量，
    # 位于阈值附近），w_fatal/w_prop 同比放大 k=132：30→3960、12→1584；
    # w_noise 不动（δC_n = n·dt 本来就按实际飞行时间计，未受暴露 bug 影响）；
    # w_ops 不动。注意：该比值仍位于阈值附近（见 sensitivity），
    # 必须配合敏感性扫描一起解读，而非单独引用这一点。
    # ------------------------------------------------------------------
    w_ops: 0.03
    w_fatal: 3960.0
    w_prop: 1584.0
    w_noise: 7.5

    # 搜索迭代上限（安全阀）：解锁定高 regime 单次搜索实测 ~6.5e5 次迭代
    # （惰性删除启用后，2026-10-09 冒烟），给 3e6 余量防截断；触顶会显式报
    # max_iterations_exceeded（≠ open_set_exhausted 无解），不会静默当作无解。
    max_iterations: 3000000

    # ------------------------------------------------------------------
    # 权重敏感性扫描（防止「挑参数挑出效果」的质疑）
    # 沿 w_fatal 扫描（w_prop 按 0.4×w_fatal 联动；w_noise 固定不动——
    # 噪声代价未受暴露口径修正影响，不随 w_fatal 联动扫描另一轴）。
    # 扫描范围 = 主设定 3960 × [0.8, 1.0, 1.2, 1.4]（相对跨度与旧扫描
    # [24,30,36,42]/30 一致）。报告各比值下 4 个出发时刻的路径长度极差。
    # 理论预期是三种机制：
    #   全直飞 regime → 混合/切换 regime → 全绕行 regime
    # 但 README §4 实测为极差随风险规避单调递减、无过渡带峰值——
    # 解读时以实测为准，是否存在「切换 regime」取决于 OD 是否提供真正的替代走廊。
    # ------------------------------------------------------------------
    sensitivity:
        enabled: true
        w_fatal_values: [3168.0, 3960.0, 4752.0, 5544.0]

    # ------------------------------------------------------------------
    # 降雨：情景化（强度/时段/热点见 configs/common.yaml 的 rain_environment 节）
    # 本处仅作实验级覆盖，不写则用 common.yaml 默认（中雨 8mm/h、14–20 时、热点高斯）。
    # 覆盖示例：
    #   rain:
    #     scenario: heavy          # light | moderate | heavy
    #     intensity_mmh: 20.0      # 或直接给强度
    #     active_hours: [14, 20]   # 降雨时段（h1<h0 跨午夜）
    #     center: [50, 50]         # 热点中心（格坐标）
    #     radius: 20               # 热点半径（格）
    # 关闭降雨：rain.enabled: false（f_rain ≡ 1）
    # 未来接入真实降雨：改 common.yaml 的 rain_environment.mode 即可，不用改代码
    # ------------------------------------------------------------------
    rain:
        enabled: false   # 与 exp_data / fig5 诊断脚本口径一致：f_rain ≡ 1（雨场全 0）
