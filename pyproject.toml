[project]
name = "risk-path"
version = "0.1.0"
description = "Risk-based UAV Path Planning and Air Corridor Design System"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Kai Zhou", email = "zhouk23@mails.tsinghua.edu.cn"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    # Core scientific computing
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    # Geospatial data processing
    "geopandas>=0.12.2",
    "shapely>=2.0.0",
    "rasterio>=1.3.0",
    "pyproj>=3.5.0",
    "cartopy>=0.22.0",
    "cnmaps>=1.1.9",
    # Visualization
    "matplotlib>=3.8.4",
    "plottable>=0.1.5",
    "pydeck>=0.8.0",
    "imageio>=2.5,<3.0",
    # Machine learning & optimization
    "scikit-learn>=0.22",
    "joblib>=0.11",
    # Statistical analysis
    "statsmodels>=0.13.2",
    # Web & data formats
    "beautifulsoup4",
    "bleach",
    "defusedxml",
    "lxml",
    "pyyaml",
    "tabulate~=0.8.7",
    # Network & HTTP
    "urllib3",
    "charset-normalizer>=2,<4",
    "idna>=2.5,<4",
    # Jupyter ecosystem (optional)
    "jupyter-core>=4.7",
    "jupyterlab-pygments",
    "nbclient>=0.5.0",
    "pandocfilters>=1.4.1",
    "tinycss2",
    "notebook>=6.0",
    # Development tools
    "cython>=0.29,!=0.29.18,!=0.29.31",
    "jedi>=0.16",
    "prompt-toolkit>=3.0.30,!=3.0.37",
    "pygments>=2.4.0",
    "traitlets>=5",
    "typing-extensions",
    "cdsapi>=0.7.7",
    "plotly>=6.7.0",
    "kaleido>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/ZXie233/Air_Corridor_Design.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/air_corridor", "src/eda_astar"]

[dependency-groups]
dev = []
